# Builds an installable Android test APK on GitHub's servers.
#
# - Every push that touches app code BUILDS the APK (proves Android still
#   compiles) and keeps it as a workflow artifact.
# - The public "test-apk" pre-release (the phone download link) is only
#   replaced when this workflow is run MANUALLY with "publish" ticked, so the
#   Android version under test never changes by accident:
#   https://github.com/<owner>/<repo>/releases/download/test-apk/MinikRenklerDunyasi.apk
name: Android test APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "CPU mimarileri (çoğu telefon için arm64-v8a yeterli)"
        required: false
        default: "arm64-v8a,armeabi-v7a"
      publish:
        description: "Test APK bağlantısını bu derlemeyle güncelle"
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "plugins/**"
      - "eslint.config.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ABIS: ${{ github.event.inputs.abis || 'arm64-v8a,armeabi-v7a' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: |
          npx expo lint
          npm run typecheck
          npx jest --ci

      - name: Stamp a unique build version (CI only, not committed)
        run: |
          jq --arg n "$GITHUB_RUN_NUMBER" '.expo.android.versionCode = ($n|tonumber) | .expo.version = ("1.0." + $n)' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "APP_VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Generate the native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Build release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures=$ABIS
          --no-daemon --console=plain
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/MinikRenklerDunyasi.apk
          ls -lh out
          sha256sum out/MinikRenklerDunyasi.apk | tee out/SHA256.txt

      - uses: actions/upload-artifact@v6
        with:
          name: MinikRenklerDunyasi-apk
          path: out/
          retention-days: 30

      - name: Publish the "test-apk" pre-release (manual runs with publish ticked, default branch only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Telefonda test için otomatik derlenen APK. **Sürüm $APP_VERSION** (commit ${GITHUB_SHA::7}, mimariler: $ABIS).

          **Kurulum:** Bu sayfadaki MinikRenklerDunyasi.apk dosyasını telefonun tarayıcısıyla indirin, indirme bildiriminden açın ve tarayıcıya 'bilinmeyen uygulamaları yükleme' izni verin. Kurduktan sonra Ebeveyn Ayarları → Sürüm satırının $APP_VERSION olduğunu kontrol edin. Ayrıntılar: docs/ANDROID_APK.md · Test listesi: docs/TEST_LISTESI.md

          Bu yapı test anahtarıyla imzalıdır; mağazaya yüklemek için EAS Build ile üretim derlemesi kullanın."
          if gh release view test-apk > /dev/null 2>&1; then
            # update in place: the download link never disappears
            gh release upload test-apk out/MinikRenklerDunyasi.apk out/SHA256.txt --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/test-apk" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit test-apk --prerelease --title "Minik Renkler Dünyası – Test APK $APP_VERSION" --notes "$NOTES"
          else
            gh release create test-apk out/MinikRenklerDunyasi.apk out/SHA256.txt \
              --prerelease --target "$GITHUB_SHA" \
              --title "Minik Renkler Dünyası – Test APK $APP_VERSION" --notes "$NOTES"
          fi
